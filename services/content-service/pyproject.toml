[project]
name = "footballpulse-content-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18,<2",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
footballpulse-content-service-health = "footballpulse_content_service.health:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
