[project]
name = "footballpulse-publisher-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "footballpulse-mongo-models",
    "footballpulse-shared",
    "pymongo>=4.16,<5",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.3,<4",
]

[tool.uv.sources]
footballpulse-mongo-models = { workspace = true }
footballpulse-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
