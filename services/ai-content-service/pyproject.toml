[project]
name = "footballpulse-ai-content-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "footballpulse-event-contracts",
    "footballpulse-runtime-config",
    "kaggle>=2.0,<3",
    "pydantic>=2.12,<3",
    "pymongo>=4.16,<5",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
local-model = [
    "llama-cpp-python>=0.3.34,<0.4",
]

[tool.uv.sources]
footballpulse-event-contracts = { workspace = true }
footballpulse-runtime-config = { workspace = true }

[project.scripts]
footballpulse-ai-content-service-health = "footballpulse_ai_content_service.health:main"
footballpulse-ai-content-service = "footballpulse_ai_content_service.server:main"
footballpulse-ai-enrichment-worker = "footballpulse_ai_content_service.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
