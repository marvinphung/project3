[project]
name = "footballpulse-ai-content-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "footballpulse-event-contracts",
    "pydantic>=2.12,<3",
]

[tool.uv.sources]
footballpulse-event-contracts = { workspace = true }

[project.scripts]
footballpulse-ai-content-service-health = "footballpulse_ai_content_service.health:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
