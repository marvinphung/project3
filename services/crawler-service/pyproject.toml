[project]
name = "footballpulse-crawler-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18,<2",
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.116,<1",
    "feedparser>=6.0,<7",
    "footballpulse-fetch-artifacts",
    "footballpulse-runtime-config",
    "httpx>=0.28,<1",
    "pymongo>=4.16,<5",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy>=2.0,<3",
    "trafilatura>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[tool.uv.sources]
footballpulse-fetch-artifacts = { workspace = true }
footballpulse-runtime-config = { workspace = true }

[project.scripts]
footballpulse-crawler-service-health = "footballpulse_crawler_service.health:main"
footballpulse-crawler-service = "footballpulse_crawler_service.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
