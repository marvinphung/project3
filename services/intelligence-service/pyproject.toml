[project]
name = "footballpulse-intelligence-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18,<2",
    "pgvector>=0.5,<0.6",
    "psycopg[binary]>=3.3,<4",
    "pymongo>=4.16,<5",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
models = [
    "gliner>=0.2.27,<0.3",
    "sentence-transformers>=5.6,<6",
    "torch>=2,<3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
footballpulse-intelligence-service-health = "footballpulse_intelligence_service.health:main"
footballpulse-intelligence-worker = "footballpulse_intelligence_service.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
