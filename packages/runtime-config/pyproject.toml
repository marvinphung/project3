[project]
name = "footballpulse-runtime-config"
version = "0.1.0"
description = "Narrow typed runtime configuration shared by FootballPulse services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"
