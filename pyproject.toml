[project]
name = "footballpulse-workspace"
version = "0.0.0"
description = "Local-first football news intelligence workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-config --strict-markers"
asyncio_mode = "strict"
testpaths = ["packages", "services", "tests"]
markers = ["integration: requires local infrastructure"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "services", "tests"]
exclude = ["packages/.*/tests/", "services/.*/tests/", "services/.*/migrations/"]
