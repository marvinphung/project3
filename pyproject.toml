[project]
name = "footballpulse"
version = "0.1.0"
description = "Local-first automated football news intelligence platform"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "types-jsonschema>=4.23,<5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "strict"
testpaths = ["tests", "packages"]
