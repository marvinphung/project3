name: footballpulse-v2

services:
  runtime-base:
    image: footballpulse-v2-runtime:local
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    profiles: ["build-only"]

  mongodb:
    image: mongo:7.0.37-jammy
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27117:27017"
    volumes:
      - footballpulse_v2_mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb-init:
    image: mongo:7.0.37-jammy
    depends_on:
      mongodb:
        condition: service_healthy
    command: ["mongosh", "--host", "mongodb:27017", "--quiet", "/scripts/init-replica-set.js"]
    volumes:
      - ./infrastructure/mongodb/init-replica-set.js:/scripts/init-replica-set.js:ro

  kafka:
    image: apache/kafka:4.3.1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - footballpulse_v2_kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - footballpulse_v2_kafka_data:/tmp/kraft-combined-logs

  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    environment:
      POSTGRES_DB: footballpulse_v2
      POSTGRES_USER: footballpulse
      POSTGRES_PASSWORD: footballpulse_v2_local
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - footballpulse_v2_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init/001-enable-vector.sql:/docker-entrypoint-initdb.d/001-enable-vector.sql:ro
      - ./infrastructure/postgres/init/003-create-airflow-db.sql:/docker-entrypoint-initdb.d/003-create-airflow-db.sql:ro
      - ./supabase/migrations/202608180001_v2_product_schema.sql:/docker-entrypoint-initdb.d/002-v2-product-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footballpulse -d footballpulse_v2"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: footballpulse-v2-runtime:local
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FOOTBALLPULSE_POSTGRES_HOST: postgres
      FOOTBALLPULSE_POSTGRES_PORT: 5432
      FOOTBALLPULSE_V2_POSTGRES_URL: postgresql+psycopg://footballpulse:footballpulse_v2_local@postgres:5432/footballpulse_v2
      SUPABASE_DB_HOST: ""
      SUPABASE_DATABASE_URL: ""
      PORT: 8000
    command: ["python", "-m", "footballpulse_api_gateway.runtime_v2"]
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  crawler:
    image: footballpulse-v2-runtime:local
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FOOTBALLPULSE_POSTGRES_HOST: postgres
      FOOTBALLPULSE_POSTGRES_PORT: 5432
      FOOTBALLPULSE_V2_POSTGRES_URL: postgresql+psycopg://footballpulse:footballpulse_v2_local@postgres:5432/footballpulse_v2
      SUPABASE_DB_HOST: ""
    command: ["python", "-m", "footballpulse_pipeline", "crawl", "--max-articles", "100"]
    restart: "no"

  processor:
    image: footballpulse-v2-runtime:local
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FOOTBALLPULSE_POSTGRES_HOST: postgres
      FOOTBALLPULSE_POSTGRES_PORT: 5432
      FOOTBALLPULSE_V2_POSTGRES_URL: postgresql+psycopg://footballpulse:footballpulse_v2_local@postgres:5432/footballpulse_v2
      SUPABASE_DB_HOST: ""
      SUPABASE_DATABASE_URL: ""
    command: ["python", "-m", "footballpulse_pipeline", "process", "--limit", "100"]
    restart: "no"

  publisher:
    image: footballpulse-v2-runtime:local
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FOOTBALLPULSE_POSTGRES_HOST: postgres
      FOOTBALLPULSE_POSTGRES_PORT: 5432
      FOOTBALLPULSE_V2_POSTGRES_URL: postgresql+psycopg://footballpulse:footballpulse_v2_local@postgres:5432/footballpulse_v2
      SUPABASE_DB_HOST: ""
      SUPABASE_DATABASE_URL: ""
    command: ["python", "-m", "footballpulse_pipeline", "publish", "--limit", "100"]
    restart: "no"

  airflow-init:
    image: footballpulse-v2-airflow:local
    build:
      context: .
      dockerfile: services/airflow.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://footballpulse:footballpulse_v2_local@postgres:5432/footballpulse_airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
      AIRFLOW__CORE__SECRET_KEY: "footballpulse-v2-airflow-secret-key-32chars!"
      AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: "footballpulse-v2-airflow-internal-key-32ch!"
      AIRFLOW__API_AUTH__JWT_SECRET: "footballpulse-v2-airflow-jwt-secret-key-32chars!"
      FOOTBALLPULSE_CRAWL_COMMAND: docker compose -f /workspace/docker-compose.v2.yml run --rm crawler python -m footballpulse_pipeline crawl
      FOOTBALLPULSE_PROCESS_COMMAND: docker compose -f /workspace/docker-compose.v2.yml run --rm processor python -m footballpulse_pipeline process
      FOOTBALLPULSE_PUBLISH_COMMAND: docker compose -f /workspace/docker-compose.v2.yml run --rm publisher python -m footballpulse_pipeline publish
    command: ["bash", "-c", "airflow db migrate"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro

  airflow-dag-processor:
    image: footballpulse-v2-airflow:local
    build:
      context: .
      dockerfile: services/airflow.Dockerfile
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment: *airflow-env
    command: ["airflow", "dag-processor"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro

  airflow-scheduler:
    image: footballpulse-v2-airflow:local
    build:
      context: .
      dockerfile: services/airflow.Dockerfile
    restart: unless-stopped
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mongodb-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment: *airflow-env
    command: ["airflow", "scheduler"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    healthcheck:
      test: ["CMD-SHELL", "airflow dags list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  airflow-webserver:
    image: footballpulse-v2-airflow:local
    build:
      context: .
      dockerfile: services/airflow.Dockerfile
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment: *airflow-env
    command: ["airflow", "api-server"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  footballpulse_v2_mongodb_data:
  footballpulse_v2_kafka_data:
  footballpulse_v2_postgres_data:
