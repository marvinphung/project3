name: footballpulse-v2

services:
  runtime-base:
    image: footballpulse-v2-runtime:local
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    profiles: ["build-only"]

  mongodb:
    image: mongo:7.0.37-jammy
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27117:27017"
    volumes:
      - footballpulse_v2_mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb-init:
    image: mongo:7.0.37-jammy
    depends_on:
      mongodb:
        condition: service_healthy
    command: ["mongosh", "--host", "mongodb:27017", "--quiet", "/scripts/init-replica-set.js"]
    volumes:
      - ./infrastructure/mongodb/init-replica-set.js:/scripts/init-replica-set.js:ro

  kafka:
    image: apache/kafka:4.3.1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - footballpulse_v2_kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - footballpulse_v2_kafka_data:/tmp/kraft-combined-logs

  api:
    image: footballpulse-v2-runtime:local
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:-}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-5432}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-postgres}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      PORT: 8000
    command: ["python", "-m", "footballpulse_api_gateway.runtime_v2"]
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  crawler:
    image: footballpulse-v2-runtime:local
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:-}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-5432}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-postgres}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
    command: ["python", "-m", "footballpulse_pipeline", "crawl", "--max-articles", "100"]
    restart: "no"

  entities-extraction:
    image: footballpulse-v2-runtime:local
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:-}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-5432}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-postgres}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
    command: ["python", "-m", "footballpulse_pipeline", "process", "--limit", "100"]
    restart: "no"

  content-summary:
    image: footballpulse-v2-runtime:local
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:-}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-5432}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-postgres}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
    command: ["python", "-m", "footballpulse_pipeline", "summary"]
    restart: "no"

  publisher:
    image: footballpulse-v2-runtime:local
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      FOOTBALLPULSE_V2_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:-}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-5432}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-postgres}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
    command: ["python", "-m", "footballpulse_pipeline", "publish", "--limit", "100"]
    restart: "no"

  airflow-init:
    image: footballpulse-v2-airflow:local
    build:
      context: .
      dockerfile: services/airflow.Dockerfile
    restart: "no"
    env_file:
      - .env
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
      AIRFLOW__CORE__SECRET_KEY: "footballpulse-v2-airflow-secret-key-32chars!"
      AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: "footballpulse-v2-airflow-internal-key-32ch!"
      AIRFLOW__API_AUTH__JWT_SECRET: "footballpulse-v2-airflow-jwt-secret-key-32chars!"
      FOOTBALLPULSE_V2_PIPELINE_SCHEDULE: "${FOOTBALLPULSE_V2_PIPELINE_SCHEDULE:-5,35 * * * *}"
      FOOTBALLPULSE_PIPELINE_CRAWL_COMMAND: docker compose -f /workspace/docker-compose.v2.yml run --rm crawler python -m footballpulse_pipeline crawl
      FOOTBALLPULSE_PIPELINE_ENTITIES_COMMAND: docker compose -f /workspace/docker-compose.v2.yml run --rm entities-extraction python -m footballpulse_pipeline process
      FOOTBALLPULSE_PIPELINE_SUMMARY_COMMAND: docker compose -f /workspace/docker-compose.v2.yml run --rm content-summary python -m footballpulse_pipeline summary
      FOOTBALLPULSE_PIPELINE_PUBLISH_COMMAND: docker compose -f /workspace/docker-compose.v2.yml run --rm publisher python -m footballpulse_pipeline publish
      FOOTBALLPULSE_CRAWL_COMMAND: docker compose -f /workspace/docker-compose.v2.yml run --rm crawler python -m footballpulse_pipeline crawl
      FOOTBALLPULSE_PROCESS_COMMAND: docker compose -f /workspace/docker-compose.v2.yml run --rm entities-extraction python -m footballpulse_pipeline process
      FOOTBALLPULSE_SUMMARY_COMMAND: docker compose -f /workspace/docker-compose.v2.yml run --rm content-summary python -m footballpulse_pipeline summary
      FOOTBALLPULSE_PUBLISH_COMMAND: docker compose -f /workspace/docker-compose.v2.yml run --rm publisher python -m footballpulse_pipeline publish
    command: ["bash", "-c", "airflow db migrate"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - footballpulse_v2_airflow_data:/opt/airflow

  airflow-dag-processor:
    image: footballpulse-v2-airflow:local
    build:
      context: .
      dockerfile: services/airflow.Dockerfile
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment: *airflow-env
    command: ["airflow", "dag-processor"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - footballpulse_v2_airflow_data:/opt/airflow

  airflow-scheduler:
    image: footballpulse-v2-airflow:local
    build:
      context: .
      dockerfile: services/airflow.Dockerfile
    restart: unless-stopped
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mongodb-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment: *airflow-env
    command: ["airflow", "scheduler"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - footballpulse_v2_airflow_data:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    healthcheck:
      test: ["CMD-SHELL", "airflow dags list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  airflow-webserver:
    image: footballpulse-v2-airflow:local
    build:
      context: .
      dockerfile: services/airflow.Dockerfile
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment: *airflow-env
    command: ["airflow", "api-server"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - footballpulse_v2_airflow_data:/opt/airflow
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  footballpulse_v2_mongodb_data:
  footballpulse_v2_kafka_data:
  footballpulse_v2_airflow_data:
