name: footballpulse

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  kafka:
    image: apache/kafka:4.3.1
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${FOOTBALLPULSE_KAFKA_PORT}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${FOOTBALLPULSE_KAFKA_PORT}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 1g
    cpus: 1.5

  kafka-init:
    image: apache/kafka:4.3.1
    profiles: ["core"]
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    mem_limit: 128m
    cpus: 0.25

  mongodb:
    image: mongo:7.0.37-jammy
    profiles: ["core"]
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${FOOTBALLPULSE_MONGODB_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 1g
    cpus: 1.0

  mongodb-init:
    image: mongo:7.0.37-jammy
    profiles: ["core"]
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    command: ["mongosh", "--host", "mongodb:27017", "--quiet", "/scripts/init-replica-set.js"]
    volumes:
      - ./infrastructure/mongodb/init-replica-set.js:/scripts/init-replica-set.js:ro
    mem_limit: 256m
    cpus: 0.5

  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    profiles: ["core", "airflow"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FOOTBALLPULSE_POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${FOOTBALLPULSE_POSTGRES_DB}
      POSTGRES_USER: ${FOOTBALLPULSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FOOTBALLPULSE_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init/001-enable-vector.sql:/docker-entrypoint-initdb.d/001-enable-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 768m
    cpus: 1.0

  redis:
    image: redis:7.2.14-alpine
    profiles: ["core"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${FOOTBALLPULSE_REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${FOOTBALLPULSE_REDIS_PORT}:6379"
    environment:
      FOOTBALLPULSE_REDIS_PASSWORD: ${FOOTBALLPULSE_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${FOOTBALLPULSE_REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5

  database-migrations:
    image: footballpulse-runtime:local
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    profiles: ["app"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &app-database-env
      FOOTBALLPULSE_POSTGRES_HOST: postgres
      FOOTBALLPULSE_POSTGRES_PORT: "5432"
      FOOTBALLPULSE_POSTGRES_DB: ${FOOTBALLPULSE_POSTGRES_DB}
      FOOTBALLPULSE_POSTGRES_USER: ${FOOTBALLPULSE_POSTGRES_USER}
      FOOTBALLPULSE_POSTGRES_PASSWORD: ${FOOTBALLPULSE_POSTGRES_PASSWORD}
    command:
      - /bin/sh
      - -c
      - >-
        alembic -c services/crawler-service/alembic.ini upgrade head &&
        alembic -c services/content-service/alembic.ini upgrade head &&
        alembic -c services/intelligence-service/alembic.ini upgrade head &&
        alembic -c services/api-gateway/alembic.ini upgrade head

  crawler-api:
    image: footballpulse-runtime:local
    logging: *default-logging
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    environment:
      <<: *app-database-env
      FOOTBALLPULSE_CRAWLER_HOST: 0.0.0.0
      FOOTBALLPULSE_CRAWLER_PORT: "8011"
      FOOTBALLPULSE_CRAWLER_ADMIN_TOKEN: ${FOOTBALLPULSE_CRAWLER_ADMIN_TOKEN}
      FOOTBALLPULSE_CRAWLER_INTERNAL_TOKEN: ${FOOTBALLPULSE_CRAWLER_INTERNAL_TOKEN}
      FOOTBALLPULSE_LOG_LEVEL: ${FOOTBALLPULSE_LOG_LEVEL:-INFO}
    command: ["footballpulse-crawler-service"]
    ports:
      - "127.0.0.1:${FOOTBALLPULSE_CRAWLER_PORT:-8011}:8011"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8011/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 10

  crawler-worker:
    image: footballpulse-crawler-worker:local
    logging: *default-logging
    build:
      context: .
      dockerfile: services/crawler-service/Dockerfile.worker
    profiles: ["app"]
    restart: "no"
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      mongodb-init:
        condition: service_completed_successfully
    environment:
      <<: *app-database-env
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0
      FOOTBALLPULSE_MONGODB_DB: ${FOOTBALLPULSE_MONGODB_DB}
      FOOTBALLPULSE_FETCH_ARTIFACT_ROOT: /workspace/.local-data/fetch-artifacts
      FOOTBALLPULSE_LOG_LEVEL: ${FOOTBALLPULSE_LOG_LEVEL:-INFO}
      FOOTBALLPULSE_BROWSER_FALLBACK: ${FOOTBALLPULSE_BROWSER_FALLBACK:-true}
    command: ["python", "-u", "scripts/run-real-crawl.py", "--max-articles", "${FOOTBALLPULSE_CRAWL_MAX_ARTICLES:-10}"]
    volumes:
      - fetch_artifacts:/workspace/.local-data/fetch-artifacts

  api-gateway:
    image: footballpulse-runtime:local
    logging: *default-logging
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    environment:
      <<: *app-database-env
      FOOTBALLPULSE_API_HOST: 0.0.0.0
      FOOTBALLPULSE_API_PORT: "8000"
      FOOTBALLPULSE_API_ADMIN_TOKEN: ${FOOTBALLPULSE_API_ADMIN_TOKEN:-local-admin-token}
      FOOTBALLPULSE_API_JWT_SECRET: ${FOOTBALLPULSE_API_JWT_SECRET:-local-jwt-secret-change-me-0123456789}
      FOOTBALLPULSE_API_ADMIN_USERNAME: ${FOOTBALLPULSE_API_ADMIN_USERNAME:-admin}
      FOOTBALLPULSE_API_ADMIN_PASSWORD: ${FOOTBALLPULSE_API_ADMIN_PASSWORD:-footballpulse-admin}
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0
      FOOTBALLPULSE_MONGODB_DB: ${FOOTBALLPULSE_MONGODB_DB:-footballpulse}
      FOOTBALLPULSE_LOG_LEVEL: ${FOOTBALLPULSE_LOG_LEVEL:-INFO}
    command: ["footballpulse-api-gateway"]
    ports:
      - "127.0.0.1:${FOOTBALLPULSE_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    logging: *default-logging
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
      crawler-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FOOTBALLPULSE_FRONTEND_PORT:-8443}:80"

  airflow-init:
    image: apache/airflow:3.0.6-python3.12
    profiles: ["airflow"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${FOOTBALLPULSE_POSTGRES_USER}:${FOOTBALLPULSE_POSTGRES_PASSWORD}@postgres:5432/${FOOTBALLPULSE_POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api_fastapi.auth.managers.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    command: ["bash", "-c", "airflow db migrate"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
    mem_limit: 1g
    cpus: 1.0

  airflow-scheduler:
    image: apache/airflow:3.0.6-python3.12
    profiles: ["airflow"]
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: ["airflow", "scheduler"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
    mem_limit: 1g
    cpus: 1.0

  airflow-api-server:
    image: apache/airflow:3.0.6-python3.12
    profiles: ["airflow"]
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: ["airflow", "api-server"]
    ports:
      - "127.0.0.1:${FOOTBALLPULSE_AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
    mem_limit: 768m
    cpus: 0.75

  ai-content:
    image: footballpulse-runtime:local
    logging: *default-logging
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    profiles: ["airflow", "app"]
    restart: unless-stopped
    environment:
      FOOTBALLPULSE_ENV: ${FOOTBALLPULSE_ENV:-production}
      FOOTBALLPULSE_LOG_LEVEL: ${FOOTBALLPULSE_LOG_LEVEL:-INFO}
      FOOTBALLPULSE_AI_INTERNAL_TOKEN: ${FOOTBALLPULSE_AI_INTERNAL_TOKEN:-local-ai-internal-token}
      FOOTBALLPULSE_AI_PROVIDER: ${FOOTBALLPULSE_AI_PROVIDER:-kaggle}
      FOOTBALLPULSE_AI_ALLOW_LOCAL_FALLBACK: ${FOOTBALLPULSE_AI_ALLOW_LOCAL_FALLBACK:-false}
      FOOTBALLPULSE_LOCAL_MODEL_PATH: ${FOOTBALLPULSE_LOCAL_MODEL_PATH:-}
      FOOTBALLPULSE_LOCAL_MODEL_SHA256: ${FOOTBALLPULSE_LOCAL_MODEL_SHA256:-}
      FOOTBALLPULSE_LOCAL_MODEL_VERSION: ${FOOTBALLPULSE_LOCAL_MODEL_VERSION:-Qwen3-4B-Instruct-GGUF-Q4_K_M}
      FOOTBALLPULSE_LOCAL_MODEL_N_CTX: ${FOOTBALLPULSE_LOCAL_MODEL_N_CTX:-8192}
      FOOTBALLPULSE_LOCAL_MODEL_N_THREADS: ${FOOTBALLPULSE_LOCAL_MODEL_N_THREADS:-8}
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0
      FOOTBALLPULSE_MONGODB_DB: ${FOOTBALLPULSE_MONGODB_DB:-footballpulse}
      FOOTBALLPULSE_KAGGLE_DATASET_SLUG: ${FOOTBALLPULSE_KAGGLE_DATASET_SLUG:-}
      FOOTBALLPULSE_KAGGLE_KERNEL_SLUG: ${FOOTBALLPULSE_KAGGLE_KERNEL_SLUG:-}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
      FOOTBALLPULSE_AI_PORT: "8000"
    ports:
      - "127.0.0.1:${FOOTBALLPULSE_AI_PORT:-8002}:8000"
    command: ["python", "-m", "footballpulse_ai_content_service.server"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 0.75

  intelligence-worker:
    image: footballpulse-intelligence-models:local
    build:
      context: .
      dockerfile: services/intelligence-service/Dockerfile.models
    logging: *default-logging
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      mongodb-init:
        condition: service_completed_successfully
    environment:
      <<: *app-database-env
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0
      FOOTBALLPULSE_MONGODB_DB: ${FOOTBALLPULSE_MONGODB_DB:-footballpulse}
      FOOTBALLPULSE_LOG_LEVEL: ${FOOTBALLPULSE_LOG_LEVEL:-INFO}
      FOOTBALLPULSE_ENTITY_PROVIDER: ${FOOTBALLPULSE_ENTITY_PROVIDER:-gliner}
      FOOTBALLPULSE_GLINER_MODEL: ${FOOTBALLPULSE_GLINER_MODEL:-urchade/gliner_small-v2.1}
      FOOTBALLPULSE_EMBEDDING_PROVIDER: ${FOOTBALLPULSE_EMBEDDING_PROVIDER:-bge}
      FOOTBALLPULSE_BGE_MODEL: ${FOOTBALLPULSE_BGE_MODEL:-BAAI/bge-small-en-v1.5}
      FOOTBALLPULSE_INTELLIGENCE_BATCH_SIZE: ${FOOTBALLPULSE_INTELLIGENCE_BATCH_SIZE:-50}
      FOOTBALLPULSE_INTELLIGENCE_POLL_SECONDS: ${FOOTBALLPULSE_INTELLIGENCE_POLL_SECONDS:-30}
    command: ["footballpulse-intelligence-worker"]
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    mem_limit: 4g
    cpus: 4.0

  ai-enrichment-worker:
    image: footballpulse-runtime:local
    logging: *default-logging
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      mongodb-init:
        condition: service_completed_successfully
      intelligence-worker:
        condition: service_started
    environment:
      <<: *app-database-env
      FOOTBALLPULSE_ENV: ${FOOTBALLPULSE_ENV:-production}
      FOOTBALLPULSE_LOG_LEVEL: ${FOOTBALLPULSE_LOG_LEVEL:-INFO}
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0
      FOOTBALLPULSE_MONGODB_DB: ${FOOTBALLPULSE_MONGODB_DB:-footballpulse}
      FOOTBALLPULSE_AI_PROVIDER: ${FOOTBALLPULSE_AI_PROVIDER:-kaggle}
      FOOTBALLPULSE_AI_ALLOW_LOCAL_FALLBACK: ${FOOTBALLPULSE_AI_ALLOW_LOCAL_FALLBACK:-false}
      FOOTBALLPULSE_LOCAL_MODEL_PATH: ${FOOTBALLPULSE_LOCAL_MODEL_PATH:-}
      FOOTBALLPULSE_LOCAL_MODEL_SHA256: ${FOOTBALLPULSE_LOCAL_MODEL_SHA256:-}
      FOOTBALLPULSE_LOCAL_MODEL_VERSION: ${FOOTBALLPULSE_LOCAL_MODEL_VERSION:-Qwen3-4B-Instruct-GGUF-Q4_K_M}
      FOOTBALLPULSE_LOCAL_MODEL_N_CTX: ${FOOTBALLPULSE_LOCAL_MODEL_N_CTX:-8192}
      FOOTBALLPULSE_LOCAL_MODEL_N_THREADS: ${FOOTBALLPULSE_LOCAL_MODEL_N_THREADS:-8}
      FOOTBALLPULSE_ENRICHMENT_BATCH_SIZE: ${FOOTBALLPULSE_ENRICHMENT_BATCH_SIZE:-10}
      FOOTBALLPULSE_ENRICHMENT_POLL_SECONDS: ${FOOTBALLPULSE_ENRICHMENT_POLL_SECONDS:-30}
      FOOTBALLPULSE_KAGGLE_DATASET_SLUG: ${FOOTBALLPULSE_KAGGLE_DATASET_SLUG}
      FOOTBALLPULSE_KAGGLE_KERNEL_SLUG: ${FOOTBALLPULSE_KAGGLE_KERNEL_SLUG}
      FOOTBALLPULSE_KAGGLE_MODEL_SOURCE: ${FOOTBALLPULSE_KAGGLE_MODEL_SOURCE}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME}
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN}
    command: ["footballpulse-ai-enrichment-worker"]
    volumes:
      - ai_batch_artifacts:/workspace/.footballpulse/ai-batches
    mem_limit: 1g
    cpus: 1.0

  story-projector:
    image: footballpulse-runtime:local
    logging: *default-logging
    build:
      context: .
      dockerfile: services/runtime.Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *app-database-env
      FOOTBALLPULSE_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0
      FOOTBALLPULSE_MONGODB_DB: ${FOOTBALLPULSE_MONGODB_DB:-footballpulse}
      FOOTBALLPULSE_PROJECTOR_POLL_SECONDS: ${FOOTBALLPULSE_PROJECTOR_POLL_SECONDS:-60}
    command:
      - /bin/sh
      - -c
      - >-
        while true; do
        python -u scripts/project-validated-enrichments.py --limit 50;
        sleep "$${FOOTBALLPULSE_PROJECTOR_POLL_SECONDS}";
        done
    mem_limit: 512m
    cpus: 0.5

volumes:
  kafka_data:
  mongodb_data:
  postgres_data:
  redis_data:
  fetch_artifacts:
  huggingface_cache:
  ai_batch_artifacts:
